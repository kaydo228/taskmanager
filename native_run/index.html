<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111212" />
    <title>Мини-доска задач</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="#top" aria-label="Мини-доска задач, начало">
          <span class="brand-mark">✓</span>
          <span>моя<br /><b>доска</b></span>
        </a>
        <div class="today"><span id="date">14 августа</span><strong id="task-count">0 задач</strong></div>
      </header>

      <section class="intro" id="top">
        <p class="eyebrow">ЛИЧНЫЙ РИТМ · БЕЗ ЛИШНЕГО</p>
        <h1>Дела, которым<br /><em>есть место</em> в дне.</h1>
        <form id="task-form" class="composer">
          <label class="sr-only" for="task-title">Название задачи</label>
          <input id="task-title" name="title" maxlength="100" placeholder="Что нужно сделать?" autocomplete="off" />
          <label class="sr-only" for="task-status">Колонка новой задачи</label>
          <select id="task-status" name="status" aria-label="Колонка новой задачи">
            <option value="inbox">Входящие</option>
            <option value="today">Сегодня</option>
            <option value="done">Готово</option>
          </select>
          <button type="submit">Добавить <span>↗</span></button>
        </form>
        <p id="form-message" class="form-message" aria-live="polite"></p>
      </section>

      <section class="board" aria-label="Доска задач">
        <article class="column column-inbox">
          <header><span class="column-number">01</span><h2>Входящие</h2><span class="dot"></span></header>
          <div class="cards" data-status="inbox"></div>
        </article>
        <article class="column column-today">
          <header><span class="column-number">02</span><h2>Сегодня</h2><span class="dot"></span></header>
          <div class="cards" data-status="today"></div>
        </article>
        <article class="column column-done">
          <header><span class="column-number">03</span><h2>Готово</h2><span class="dot"></span></header>
          <div class="cards" data-status="done"></div>
        </article>
      </section>
    </main>
    <template id="task-template">
      <article class="task-card">
        <div class="task-line"><span class="task-pin"></span><h3></h3></div>
        <div class="task-controls">
          <select aria-label="Переместить задачу"></select>
          <button class="delete" type="button" aria-label="Удалить задачу">×</button>
        </div>
      </article>
    </template>
    <script type="module" src="./app.js"></script>
  </body>
</html>
